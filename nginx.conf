map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name brandbot.titanteam.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://brandbot.titanteam.org$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name brandbot.titanteam.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/brandbot.titanteam.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brandbot.titanteam.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 100m;

    # Resolve service changes after upstream containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3001;
    set $frontend http://frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api {
        return 308 /api/;
    }
    location ^~ /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
    # Uploads must pass backend authentication.
    location ^~ /uploads/ {
        proxy_pass $backend;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass $frontend;
    }
}
